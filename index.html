<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHRED-APP · Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--ink:#0c1424;--panel:#131e33;--line:#26344f;--ice:#e6edf7;--mute:#8a9ab8;--iris:#7c8cff;--bad:#ff6b5e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 50% -10%,#1a2a4d,var(--ink));color:var(--ice);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:380px}
.eye{display:block;margin:0 auto 18px}
h1{font-size:30px;font-weight:800;text-align:center;margin:0 0 4px;letter-spacing:.5px}
p.sub{text-align:center;color:var(--mute);margin:0 0 26px;font-size:15px}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
label{display:block;font-size:14px;color:var(--mute);margin:0 0 6px}
input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--ice);font:inherit;padding:12px;margin-bottom:16px}
input:focus,button:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin:-4px 0 18px}
.row input{width:auto;margin:0}
button{width:100%;background:var(--iris);color:#0c1424;border:0;border-radius:8px;font:inherit;font-weight:800;padding:13px;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--bad);font-size:14px;min-height:20px;margin:12px 0 0}
footer{text-align:center;color:var(--mute);font-size:12.5px;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<main>
  <svg class="eye" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
    <path d="M4 42C14 22 28 12 42 12s28 10 38 30c-10 20-24 30-38 30S14 62 4 42Z" fill="none" stroke="#7c8cff" stroke-width="3"/>
    <circle cx="42" cy="42" r="15" fill="none" stroke="#e6edf7" stroke-width="3"/>
    <circle cx="42" cy="42" r="6" fill="#7c8cff"/>
  </svg>
  <h1>SHRED-APP</h1>
  <p class="sub">Secure, recover and erase evidence files</p>

  <form id="f" autocomplete="off" novalidate>
    <label for="u">Username</label>
    <input id="u" name="u" type="text" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="p" type="password" autocomplete="current-password" required>
    <div class="row"><input id="show" type="checkbox"><label for="show" style="margin:0">Show password</label></div>
    <button id="go" type="submit">Sign in</button>
    <p id="err" role="alert"></p>
  </form>
  <footer>Authorized personnel only. All activity in this session is logged locally.</footer>
</main>

<script>
// If already signed in, skip straight to the dashboard
if (sessionStorage.getItem('shred_session')) location.replace('dashboard.html');

const $ = id => document.getElementById(id);
$('show').onchange = e => $('p').type = e.target.checked ? 'text' : 'password';

/*
 * IMPORTANT: replace this with a real backend call (e.g. fetch('/api/login')).
 * Front-end-only checks are NOT real security — anyone can read this file.
 */
async function authenticate(user, pass) {
  await new Promise(r => setTimeout(r, 500));
  return user.length >= 3 && pass.length >= 8;   // placeholder rule
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const user = $('u').value.trim(), pass = $('p').value;
  $('err').textContent = '';
  if (!user || !pass) { $('err').textContent = 'Enter your username and password.'; return; }
  $('go').disabled = true; $('go').textContent = 'Verifying…';
  const ok = await authenticate(user, pass);
  if (ok) {
    sessionStorage.setItem('shred_session', JSON.stringify({ user, at: Date.now() }));
    location.replace('dashboard.html');
  } else {
    $('err').textContent = 'Sign-in failed. Use at least 3 characters for username and 8 for password.';
    $('go').disabled = false; $('go').textContent = 'Sign in';
  }
});
</script>
</body>
</html>
