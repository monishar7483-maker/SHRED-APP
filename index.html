<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHRED SQUADERS | Secure Access</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #070b12;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: auto;
            border: 2px solid #19d3ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 0 25px rgba(25, 211, 255, 0.15);
        }

        .logo h1 {
            margin-top: 15px;
            font-size: 27px;
            letter-spacing: 2px;
        }

        .logo p {
            margin-top: 8px;
            color: #8993a4;
            font-size: 13px;
        }

        .login-card {
            background: #101620;
            border: 1px solid #27313f;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .login-card h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            color: #8993a4;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #c8d0dc;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #303b4a;
            background: #080d14;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #19d3ff;
            box-shadow: 0 0 0 2px rgba(25, 211, 255, 0.08);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 9px;
            background: #19d3ff;
            color: #041016;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #53ddff;
        }

        .forgot {
            text-align: right;
            margin: 14px 0 20px;
        }

        .forgot a {
            color: #19d3ff;
            font-size: 13px;
            text-decoration: none;
        }

        .security-note {
            margin-top: 22px;
            padding: 12px;
            border-radius: 9px;
            background: #0b111a;
            border: 1px solid #202b39;
            color: #8d98a8;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #182331;
            color: #b9c5d4;
            text-align: center;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #596575;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- LOGO -->
        <div class="logo">

            <div class="logo-icon">
                🛡️
            </div>

            <h1>SHRED SQUADERS</h1>

            <p>
                Cybersecurity & Digital Forensics
            </p>

        </div>


        <!-- LOGIN CARD -->
        <div class="login-card">

            <h2>Secure Access</h2>

            <p class="subtitle">
                Sign in to securely access your forensic data
                and investigation workspace.
            </p>


            <!-- EMAIL -->
            <div class="input-group">

                <label for="email">
                    Professional Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <!-- PASSWORD -->
            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

            </div>


            <!-- FORGOT PASSWORD -->
            <div class="forgot">

                <a href="#" onclick="forgotPassword()">
                    Forgot password?
                </a>

            </div>


            <!-- LOGIN -->
            <button
                class="login-btn"
                onclick="login()">

                SIGN IN SECURELY

            </button>


            <!-- MESSAGE -->
            <div
                class="message"
                id="message">
            </div>


            <!-- SECURITY MESSAGE -->
            <div class="security-note">

                🔒 Authorized personnel only.<br>
                Access to forensic and investigation data
                is restricted to verified users.

            </div>

        </div>


        <div class="footer">
            SHRED SQUADERS © 2026
        </div>

    </div>


    <script>

        function login() {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            if (email === "" || password === "") {

                message.innerHTML =
                    "⚠️ Please enter your email and password.";

                message.style.display = "block";

                return;
            }


            message.innerHTML =
                "✓ Credentials received. Secure authentication will be connected next.";

            message.style.display = "block";
        }


        function forgotPassword() {

            const message =
                document.getElementById("message");

            message.innerHTML =
                "Password recovery will be available after secure authentication is connected.";

            message.style.display = "block";
        }

    </script>

</body>
</html>
<script>
function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "" || password === "") {
        alert("Please enter your email and password.");
        return;
    }

    // Temporary demo login
    window.location.href = "dashboard.html";
}
</script>
